<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Cadastro com Validação</title>
</head>
<body>

  <h2>Cadastro</h2>

  <form id="formCadastro">
    <input type="text" id="nome" placeholder="Nome"><br><br>
    <input type="text" id="email" placeholder="E-mail"><br><br>
    <input type="number" id="idade" placeholder="Idade"><br><br>
    <input type="password" id="senha" placeholder="Senha"><br><br>

    <button type="submit">Cadastrar</button>
  </form>

  <p id="mensagem"></p>

  <script src="script.js"></script>

</body>
</html>
