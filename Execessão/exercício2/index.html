<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulário de Cadastro</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="container">
    <h2>Cadastro</h2>

    <!-- Lista geral de erros -->
    <div id="errorList" class="error-list" style="display:none;">
      <ul id="errors"></ul>
    </div>

    <form id="cadastroForm">

      <div class="form-group">
        <label>Nome</label>
        <input type="text" id="nome">
        <div class="error" id="nomeError"></div>
      </div>

      <div class="form-group">
        <label>CPF</label>
        <input type="text" id="cpf">
        <div class="error" id="cpfError"></div>
      </div>

      <div class="form-group">
        <label>Data de nascimento</label>
        <input type="date" id="dataNascimento">
        <div class="error" id="dataError"></div>
      </div>

      <div class="form-group">
        <label>Senha</label>
        <input type="password" id="senha">
        <div class="error" id="senhaError"></div>
      </div>

      <div class="form-group">
        <label>Confirmar senha</label>
        <input type="password" id="confirmarSenha">
        <div class="error" id="confirmarSenhaError"></div>
      </div>

      <button type="submit">Cadastrar</button>

      <div class="success" id="successMessage"></div>
    </form>
  </div>

  <script src="script.js"></script>
</body>
</html>
